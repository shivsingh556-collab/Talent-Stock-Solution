name: Production verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Source and logic
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify signed-out and authenticated boot
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/todo-ai-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          TSS_BASE_URL=http://127.0.0.1:4173/ node browser-smoke.test.cjs

  call-tracker:
    name: Recruiter workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify calling and interview workflows
        run: |
          node calling-tracker-save.browser.test.cjs
          node interview-candidate-search.browser.test.cjs
          node requirement-search.browser.test.cjs

  candidate-and-mobile:
    name: Candidate isolation and mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-verification
          path: test-results/
          if-no-files-found: ignore

  release-checks:
    name: Release checks
    if: always()
    needs: [verify, call-tracker, candidate-and-mobile]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every verification job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs=JSON.parse(process.env.RESULTS); if(Object.values(jobs).some(job=>job.result!=="success")) process.exit(1)'
