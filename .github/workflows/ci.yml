name: CI Guard
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Site inventory
        run: |
          test -f index.html
          test -f src/js/app.js
          test -f src/css/styles.css
          echo "Talent-Stock-Solution tree is intact"
      - name: HTML present
        run: grep -q "<!DOCTYPE html>" index.html || grep -qi "<html" index.html
      - name: Build organized sources
        run: |
          node scripts/build-production.mjs
          node --check auth-bootstrap.js
          node --check app-core.js
          node --check app-runtime.js
