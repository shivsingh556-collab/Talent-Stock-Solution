<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TODO AI · Backend Feedback Hub Test</title><style>body{margin:0;background:#07111c;color:#eef7ff;font-family:Inter,system-ui}.wrap{max-width:1100px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.pill{padding:8px 12px;border:1px solid #6655cc;border-radius:999px;background:#211b45}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;margin-top:18px}.panel{background:#0d1c2c;border:1px solid #23425e;border-radius:14px;padding:18px}.card{border:1px solid #274965;background:#0a1b2b;border-radius:10px;padding:14px;margin:10px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.btn{border:1px solid #3385c7;border-radius:8px;background:#146fc7;color:#fff;padding:9px 12px;cursor:pointer}.btn.secondary{background:#0b2942}.muted{color:#8ba8c2}.badge{font-size:11px;padding:5px 8px;border-radius:999px;background:#16324b}.link{word-break:break-all;background:#06121e;border:1px solid #213f57;padding:8px;border-radius:7px;margin-top:8px;color:#8bc8ff;font-size:11px}dialog{width:min(620px,92vw);background:#0a1927;color:#fff;border:1px solid #315978;border-radius:14px}input,select,textarea{width:100%;box-sizing:border-box;background:#07131f;color:#fff;border:1px solid #2b4b65;border-radius:8px;padding:10px;margin-top:5px}label{display:block;margin-top:10px;color:#9bb6cd;font-size:12px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.status{margin-top:14px;padding:10px;border:1px solid #294c68;border-radius:8px;color:#9fc0db}@media(max-width:800px){.grid{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div><div class="muted">TODO AI · ISOLATED BACKEND TEST</div><h1>Candidate Feedback Hub</h1><div class="muted">Separate free Supabase project. No production TODO AI data is used.</div></div><div class="pill">BACKEND TEST MODE</div></div><div class="grid"><section class="panel"><h2>Recruiter View</h2><div id="candidates"></div><h2>Requests</h2><div id="requests"></div></section><section class="panel"><h2>Candidate Timeline</h2><div id="timeline" class="muted">Select a candidate timeline.</div><div id="health" class="status">Checking backend...</div></section></div></div><dialog id="reqDlg"><form method="dialog"><h3>Request Client Feedback</h3><input id="cid" type="hidden"><label>Client Contact<input id="contact" value="Hiring Manager"></label><label>Recipient Email<input id="email" value="client@example.com"></label><label>Due in<select id="due"><option>24</option><option>48</option><option>72</option></select></label><label>Message<textarea id="msg">Please share your feedback for this candidate.</textarea></label><div class="actions"><button>Cancel</button><button type="button" class="btn" id="create">Generate Secure Link</button></div></form></dialog><dialog id="fbDlg"><form method="dialog"><h3>Client Feedback</h3><div id="fbCandidate" class="card"></div><label>Decision<select id="outcome"><option>Shortlisted</option><option>Next Round</option><option>Hold</option><option>Rejected</option><option>Selected</option><option>Candidate Not Suitable</option></select></label><label>Rating<select id="rating"><option value="">No rating</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label>Comments<textarea id="comments"></textarea></label><label id="reasonWrap" style="display:none">Rejection Reason<input id="reason"></label><label id="nextWrap" style="display:none">Next Round Date & Time<input id="next" type="datetime-local"></label><label>Interviewer<input id="interviewer"></label><div class="actions"><button>Cancel</button><button type="button" class="btn" id="submit">Submit Feedback</button></div></form></dialog><script>
const API='https://iihvfixonxwacxccenws.supabase.co/functions/v1/feedback-api';const TEST='todo-feedback-test-2026';const C=[{id:'TST001',name:'Aarav Mehta',role:'Sales Manager',client:'NovaEdge Technologies'},{id:'TST002',name:'Riya Kapoor',role:'Data Engineer',client:'BrightCore Systems'},{id:'TST003',name:'Kabir Shah',role:'Key Account Manager',client:'Apex Logistics'}];let token=null,sel='TST001';const $=s=>document.querySelector(s);async function api(path,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json','x-test-key':TEST};const r=await fetch(API+path,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}
function renderC(){candidates.innerHTML=C.map(x=>`<div class="card"><div class="row"><div><b>${x.name}</b><div class="muted">${x.role} · ${x.client}</div></div><div><button class="btn" onclick="openReq('${x.id}')">Request Feedback</button> <button class="btn secondary" onclick="showTimeline('${x.id}')">Timeline</button></div></div></div>`).join('')}
window.openReq=id=>{cid.value=id;reqDlg.showModal()};create.onclick=async()=>{create.disabled=true;health.textContent='Creating backend request...';try{const j=await api('?action=create',{method:'POST',body:JSON.stringify({candidate_id:cid.value,client_contact:contact.value,recipient_email:email.value,due_hours:Number(due.value),request_message:msg.value})});reqDlg.close();token=j.request.token;health.textContent='Backend request created successfully.';await load();await openClient(token)}catch(e){health.textContent='ERROR: '+e.message}finally{create.disabled=false}};
async function load(){try{const j=await api('?action=list');requests.innerHTML=(j.requests||[]).map(r=>`<div class="card"><div class="row"><div><b>${r.candidate_name}</b><div class="muted">${r.role_title} · ${r.client_name}</div></div><span class="badge">${r.status}</span></div><div class="link">${location.origin}${location.pathname}?feedbackToken=${r.token}</div><div style="margin-top:8px"><button class="btn secondary" onclick="openClient('${r.token}')">Open Client Link</button> <button class="btn secondary" onclick="showTimeline('${r.candidate_id}')">Timeline</button></div>${r.outcome?`<div class="muted" style="margin-top:8px">Decision: ${r.outcome}${r.rating?` · ${r.rating}/5`:''}</div>`:''}</div>`).join('')||'<div class="muted">No requests yet.</div>';health.textContent='Backend connected · separate test database';}catch(e){health.textContent='Backend error: '+e.message}}
window.showTimeline=async id=>{sel=id;try{const j=await api('?action=events&candidate_id='+encodeURIComponent(id));const c=C.find(x=>x.id===id);timeline.innerHTML=`<div class="card"><b>${c.name}</b><div class="muted">${c.role} · ${c.client}</div></div>`+(j.events||[]).map(e=>`<div class="card"><b>${e.event_type}</b><div class="muted">${e.event_detail||''}</div><div class="muted">${new Date(e.created_at).toLocaleString()}</div></div>`).join('')||'<div class="muted">No events.</div>'}catch(e){timeline.textContent='Timeline error: '+e.message}};
function updateConditionalFields(){const o=outcome.value;const rejected=['Rejected','Candidate Not Suitable'].includes(o);const nextRound=o==='Next Round';reasonWrap.style.display=rejected?'block':'none';nextWrap.style.display=nextRound?'block':'none';if(!rejected)reason.value='';if(!nextRound)next.value=''}
outcome.addEventListener('change',updateConditionalFields);
window.openClient=async t=>{token=t;try{const r=await fetch(API+'?action=open&token='+encodeURIComponent(t));const j=await r.json();if(!r.ok)throw new Error(j.error||'Could not open link');const x=j.request;fbCandidate.innerHTML=`<b>${x.candidate_name}</b><div class="muted">${x.role_title} · ${x.client_name}</div>`;outcome.value='Shortlisted';rating.value='';comments.value='';reason.value='';next.value='';interviewer.value='';updateConditionalFields();fbDlg.showModal();await load()}catch(e){health.textContent='Client link error: '+e.message}};
submit.onclick=async()=>{submit.disabled=true;try{const o=outcome.value;const rr=reason.value.trim();if(['Rejected','Candidate Not Suitable'].includes(o)&&!rr)throw new Error('Please enter a rejection reason.');if(o==='Next Round'&&!next.value)throw new Error('Please select the next round date and time.');const j=await fetch(API+'?action=submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,outcome:o,rating:rating.value?Number(rating.value):null,comments:comments.value,rejection_reason:rr||null,next_round_at:o==='Next Round'?new Date(next.value).toISOString():null,interviewer_name:interviewer.value})});const x=await j.json();if(!j.ok)throw new Error(x.error||'Submit failed');fbDlg.close();health.textContent='Feedback saved to test Supabase and workflow mapping recorded.';await load();await showTimeline(x.request.candidate_id)}catch(e){health.textContent='Submit error: '+e.message}finally{submit.disabled=false}};
renderC();load();updateConditionalFields();const q=new URLSearchParams(location.search);if(q.get('feedbackToken'))setTimeout(()=>openClient(q.get('feedbackToken')),300);
</script></body></html>
